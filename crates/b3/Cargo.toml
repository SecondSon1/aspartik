[package]
name = "b3"

version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bitmap = { workspace = true }
buffer = { workspace = true }
data = { workspace = true }
io = { workspace = true }
linalg = { workspace = true }
math = { workspace = true }
rng = { workspace = true }
sk = { workspace = true, features = ["serde"] }
util = { workspace = true }

anyhow = { workspace = true }
arrow-array = { workspace = true }
arrow-ipc = { workspace = true, features = ["zstd"] }
arrow-schema = { workspace = true }
blake3 = { workspace = true }
bytemuck = { workspace = true, features = ["derive", "extern_crate_alloc"] }
cudarc = { workspace = true, features = ["driver", "nvrtc", "dynamic-loading", "cuda-12000", "std"] }
rayon = { workspace = true }
num-traits = { workspace = true }
parking_lot = { workspace = true }
pyo3 = { workspace = true, features = ["anyhow"] }
rand = { workspace = true, features = ["alloc"] }
rand_pcg = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_verbatim = { workspace = true, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-metal = { workspace = true }
objc2-foundation = { workspace = true }

[lints]
workspace = true
